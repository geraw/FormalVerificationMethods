<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="איור קומי של בעיית בדיקת בטיחות רגולרית">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#fffdf7"/>

  <!-- Transition system -->
  <g filter="url(#shadow)">
    <rect x="55" y="88" width="260" height="250" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="185" y="126" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="25" font-weight="700" fill="#1d4ed8" text-anchor="middle">TS</text>
    <rect x="89" y="161" width="58" height="38" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="223" y="161" width="58" height="38" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="156" y="248" width="58" height="38" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="118" y="186" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">s₀</text>
    <text x="252" y="186" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">s₁</text>
    <text x="185" y="273" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">s₂</text>
    <path d="M 148 180 H 217" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
    <path d="M 244 201 C 228 229 211 241 204 246" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
    <path d="M 163 246 C 143 227 126 214 120 201" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
    <path d="M 70 180 H 84" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
    <text x="118" y="155" font-family="Arial" font-size="15" fill="#1e3a8a" text-anchor="middle">{}</text>
    <text x="252" y="155" font-family="Arial" font-size="15" fill="#1e3a8a" text-anchor="middle">{a}</text>
    <text x="185" y="307" font-family="Arial" font-size="15" fill="#1e3a8a" text-anchor="middle">{b}</text>
    <text x="185" y="330" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="17" fill="#1e3a8a" text-anchor="middle" direction="rtl">מערכת מעברים</text>
  </g>

  <!-- Bad prefix automaton -->
  <g filter="url(#shadow)">
    <rect x="645" y="88" width="260" height="250" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="775" y="121" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="23" font-weight="700" fill="#b91c1c" text-anchor="middle" direction="rtl">אוטומט לרישות רעות</text>
    <circle cx="714" cy="206" r="30" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <circle cx="837" cy="206" r="30" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <circle cx="837" cy="206" r="23" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="714" y="213" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">q₀</text>
    <text x="837" y="213" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">q₁</text>
    <path d="M 745 206 H 806" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/>
    <path d="M 666 206 H 678" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/>
    <path d="M 837 175 C 873 142 906 174 866 196" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/>
    <text x="775" y="298" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="18" fill="#7f1d1d" text-anchor="middle" direction="rtl">מקבל רישא רעה</text>
  </g>

  <!-- Algorithm character -->
  <g filter="url(#shadow)">
    <rect x="364" y="138" width="232" height="155" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="480" y="176" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="25" font-weight="700" fill="#92400e" text-anchor="middle" direction="rtl">אלגוריתם</text>
    <circle cx="450" cy="224" r="30" fill="#fff7ed" stroke="#92400e" stroke-width="4"/>
    <circle cx="446" cy="219" r="4" fill="#0f172a"/>
    <circle cx="464" cy="219" r="4" fill="#0f172a"/>
    <path d="M 445 237 Q 456 245 468 237" stroke="#0f172a" stroke-width="3" fill="none"/>
    <circle cx="525" cy="220" r="26" fill="none" stroke="#0f172a" stroke-width="6"/>
    <path d="M 544 239 L 574 268" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <text x="480" y="281" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="17" fill="#78350f" text-anchor="middle" direction="rtl">בודק את המכפלה</text>
  </g>

  <path d="M 315 205 C 340 205 338 205 360 205" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)" fill="none"/>
  <path d="M 645 205 C 620 205 618 205 598 205" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)" fill="none"/>

  <!-- Outputs -->
  <g filter="url(#shadow)" font-family="Arial, 'Noto Sans Hebrew', sans-serif" text-anchor="middle">
    <rect x="235" y="405" width="205" height="78" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="337" y="454" font-size="26" font-weight="700" fill="#166534" direction="rtl">✓ מקיימת</text>
    <rect x="505" y="392" width="275" height="108" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
    <text x="642" y="424" font-size="23" font-weight="700" fill="#991b1b" direction="rtl">דוגמה נגדית</text>
    <rect x="540" y="448" width="48" height="32" rx="6" fill="#ffffff" stroke="#991b1b" stroke-width="3"/>
    <rect x="620" y="448" width="48" height="32" rx="6" fill="#ffffff" stroke="#991b1b" stroke-width="3"/>
    <rect x="700" y="448" width="48" height="32" rx="6" fill="#ffffff" stroke="#991b1b" stroke-width="3"/>
    <text x="564" y="470" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">s₀</text>
    <text x="644" y="470" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">s₁</text>
    <text x="724" y="470" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">s₂</text>
    <path d="M 590 464 H 614" stroke="#991b1b" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/>
    <path d="M 670 464 H 694" stroke="#991b1b" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/>
  </g>
  <path d="M 452 295 C 430 340 375 360 350 396" stroke="#16a34a" stroke-width="6" fill="none"/>
  <polygon points="345,402 355,368 376,388" fill="#16a34a"/>
  <path d="M 510 295 C 536 342 603 354 635 390" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow-red)" fill="none"/>
</svg>

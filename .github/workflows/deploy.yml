name: Deploy pages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild every deck even if cache signatures match'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build-all.js'
      - 'package.json'
      - 'package-lock.json'
      - 'slidev.config.js'
      - 'styles.css'
      - 'components/**'
      - 'public/**'
      - 'images/**'
      - 'setup/**'
      - '*.md'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.svg'
      - '*.gif'
      - '*.webp'
      - '*.pdf'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: fetch full history for file timestamps

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright for PDF export
        run: |
          npm i -D playwright-chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Restore previous dist snapshot
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-dist-${{ github.ref_name }}-

      - name: Build
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild && '1' || '0' }}
        run: nr build:all

      - name: Save dist snapshot
        uses: actions/cache/save@v4
        if: success()
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ github.ref_name }}-${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

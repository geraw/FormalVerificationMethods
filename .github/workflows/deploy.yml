name: Deploy pages

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild every deck even if cache signatures match'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build-all.js'
      - 'package.json'
      - 'package-lock.json'
      - 'slidev.config.js'
      - 'styles.css'
      - 'components/**'
      - 'public/**'
      - 'images/**'
      - 'setup/**'
      - '*.md'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.svg'
      - '*.gif'
      - '*.webp'
      - '*.pdf'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SKIP_PDF_EXPORT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: fetch full history for file timestamps

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: |
          rm -rf dist
          mkdir -p dist/15-omega-regular-languages
          npx slidev build "15-omega-regular-languages.md" --download "false" --base "/FormalVerificationMethods/15-omega-regular-languages/" -o "dist/15-omega-regular-languages"
          cat > dist/index.html << 'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/FormalVerificationMethods/15-omega-regular-languages/">
          <title>Redirecting...</title>
          <a href="/FormalVerificationMethods/15-omega-regular-languages/">Open deck 15</a>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 60 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">NanoPromela Semantics Translation Comic</title>
  <desc id="desc">Comic style pipeline: NanoPromela to Program Graph to Channel System to Transition System.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b5e34"/>
    </marker>
    <style>
      .bubble { stroke-width: 4; filter: url(#shadow); }
      .node-title { font-family: 'Rubik', 'Arial', sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .node-sub { font-family: 'Rubik', 'Arial', sans-serif; font-size: 21px; fill: #334155; }
      .caption { font-family: 'Rubik', 'Arial', sans-serif; font-size: 27px; font-weight: 700; fill: #0f172a; }
      .note { font-family: 'Rubik', 'Arial', sans-serif; font-size: 24px; fill: #334155; }
      .tiny { font-family: 'Rubik', 'Arial', sans-serif; font-size: 23px; fill: #14532d; font-weight: 700; }
    </style>
  </defs>

  <rect x="8" y="8" width="1384" height="544" rx="36" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="1325" cy="55" r="42" fill="#fde68a" opacity="0.55"/>
  <circle cx="75" cy="515" r="56" fill="#bae6fd" opacity="0.45"/>

  <rect class="bubble" x="46" y="115" width="290" height="165" rx="28" fill="#fde68a" stroke="#f59e0b"/>
  <text class="node-title" x="191" y="178" text-anchor="middle" direction="ltr">Transition System</text>
  <text class="node-sub" x="191" y="228" text-anchor="middle">עכשיו אפשר לאמת</text>

  <rect class="bubble" x="385" y="115" width="290" height="165" rx="28" fill="#fecdd3" stroke="#fda4af"/>
  <text class="node-title" x="530" y="178" text-anchor="middle" direction="ltr">Channel System</text>
  <text class="node-sub" x="530" y="228" text-anchor="middle">אני מוסיף תקשורת ותורים</text>

  <rect class="bubble" x="724" y="115" width="290" height="165" rx="28" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="node-title" x="869" y="178" text-anchor="middle">גרף תוכנית</text>
  <text class="node-sub" x="869" y="228" text-anchor="middle">אני מתאר זרימת ביצוע</text>

  <rect class="bubble" x="1063" y="115" width="290" height="165" rx="28" fill="#fed7aa" stroke="#fdba74"/>
  <text class="node-title" x="1208" y="178" text-anchor="middle" direction="ltr">NanoPromela</text>
  <text class="node-sub" x="1208" y="228" text-anchor="middle">אני רק תחביר</text>

  <path d="M336 198 L375 198" stroke="#8b5e34" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <path d="M675 198 L714 198" stroke="#8b5e34" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <path d="M1014 198 L1053 198" stroke="#8b5e34" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowHead)"/>

  <path d="M92 94 C130 58, 248 56, 287 92" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 95 C468 58, 586 58, 625 95" fill="none" stroke="#be123c" stroke-width="5" stroke-linecap="round"/>
  <path d="M769 95 C807 58, 925 58, 964 95" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M1108 95 C1146 58, 1264 58, 1303 95" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>

  <rect x="120" y="335" width="1160" height="124" rx="20" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="3"/>
  <text class="caption" x="700" y="385" text-anchor="middle">סמנטיקה באמצעות תרגום</text>
  <text class="note" x="700" y="426" text-anchor="middle">לא מגדירים ישירות על הקוד, אלא דרך מודלים עם משמעות פורמלית מדויקת.</text>

  <rect x="548" y="478" width="304" height="58" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="3"/>
  <text class="tiny" x="700" y="515" text-anchor="middle" direction="ltr">Translation = Semantics</text>
</svg>

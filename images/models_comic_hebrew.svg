<svg viewBox="0 0 450 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="models-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9" />
    </marker>
    <marker id="success-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf" />
    </marker>
    <filter id="models-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Panel Background -->
  <rect x="5" y="5" width="440" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#models-shadow)"/>
  
  <!-- Text Description -->
  <g transform="translate(225, 25)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle" direction="rtl">האם התנאי מתקיים על הערכים שלי?</text>
  </g>

  <!-- Character: The Evaluator (eta) -->
  <g transform="translate(370, 70)">
    <text x="0" y="30" font-size="60" text-anchor="middle">🧑‍🏫</text>
    <text x="0" y="60" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle" direction="rtl">המעריך</text>
    <text x="0" y="85" font-size="24" font-weight="bold" font-family="serif" fill="#0ea5e9" text-anchor="middle">η</text>
    <!-- Holding current values -->
    <rect x="-40" y="95" width="80" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="0" y="117" font-size="16" font-family="monospace" font-weight="bold" fill="#10b981" text-anchor="middle">x=42</text>
  </g>
  
  <!-- Condition Box (g) -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4" stroke-width="2"/>
    <text x="80" y="25" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle" direction="rtl">תנאי g:</text>
    <text x="80" y="48" font-size="20" font-family="monospace" font-weight="bold" fill="#b91c1c" text-anchor="middle">x > 10</text>
  </g>
  
  <!-- Arrow from eta to Condition -->
  <path d="M 320 90 L 205 90" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#models-arrow)"/>

  <!-- connection to result -->
  <path d="M 110 120 L 110 148" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#success-arrow)"/>

  <!-- Satisfaction Result : eta models g -->
  <g transform="translate(110, 160)">
    <rect x="-85" y="-10" width="170" height="40" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <text x="-60" y="18" font-size="22" text-anchor="middle">✅</text>
    <text x="-37" y="17" font-size="22" font-family="serif" font-weight="bold" fill="#15803d" text-anchor="start">η ⊨ g</text>
    <text x="-55" y="45" font-size="14" font-weight="bold" fill="#166534" text-anchor="end" direction="rtl">(התנאי מתקיים)</text>
  </g>
  
</svg>
